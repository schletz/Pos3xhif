  <text x="785" y="442" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="normal" fill="#1d1d1b" text-anchor="middle">foreach (… in product)</text>
  <text x="785" y="466" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1d1d1b" text-anchor="middle">kompiliert nicht (CS1579)</text>
