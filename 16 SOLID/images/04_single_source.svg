<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d1d1b"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="939" height="439" rx="8" fill="#ffffff" stroke="#9d9d9c"/>
  <text x="470" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1d1d1b" text-anchor="middle">Gratisversand ab 50 €: Wo steht die Regel?</text>

  <!-- Left panel: before -->
  <rect x="20" y="62" width="430" height="358" rx="10" fill="#ffffff" stroke="#cc0935" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="40" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#a8072c">✗ Vorher: die Regel an vier Stellen</text>

  <rect x="40" y="112" width="390" height="54" rx="6" fill="#ffffff" stroke="#9d9d9c" stroke-width="1.5"/>
  <text x="54" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d1d1b">CartView</text>
  <text x="54" y="155" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1d1d1b">if (order.Total &gt;= <tspan font-weight="bold" fill="#a8072c">50m</tspan>)</text>

  <rect x="40" y="176" width="390" height="54" rx="6" fill="#ffffff" stroke="#9d9d9c" stroke-width="1.5"/>
  <text x="54" y="197" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d1d1b">CartView</text>
  <text x="54" y="219" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1d1d1b">return "Free shipping from <tspan font-weight="bold" fill="#a8072c">50</tspan> EUR";</text>

  <rect x="40" y="240" width="390" height="54" rx="6" fill="#ffffff" stroke="#9d9d9c" stroke-width="1.5"/>
  <text x="54" y="261" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d1d1b">CheckoutService</text>
  <text x="54" y="283" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1d1d1b">if (order.Total &gt;= <tspan font-weight="bold" fill="#a8072c">50m</tspan>)</text>

  <rect x="40" y="304" width="390" height="54" rx="6" fill="#f6d3db" stroke="#cc0935" stroke-width="2"/>
  <text x="54" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d1d1b">InvoiceWriter</text>
  <text x="416" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#a8072c" text-anchor="end">✗ &gt; statt &gt;=</text>
  <text x="54" y="347" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1d1d1b">if (order.Total <tspan font-weight="bold" fill="#a8072c">&gt;</tspan> <tspan font-weight="bold" fill="#a8072c">50m</tspan>)</text>

  <text x="40" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">50 € → 60 €: <tspan font-weight="bold">4 Stellen</tspan> ändern. Eine vergessen?</text>

  <!-- Right panel: after -->
  <rect x="470" y="62" width="450" height="358" rx="10" fill="#ffffff" stroke="#71af2e" stroke-width="2"/>
  <text x="490" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#4a7a1c">✓ Nachher: die Regel an einer Stelle</text>

  <rect x="490" y="112" width="125" height="44" rx="6" fill="#ffffff" stroke="#9d9d9c" stroke-width="1.5"/>
  <text x="552.5" y="139" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d1d1b" text-anchor="middle">CartView</text>
  <rect x="632.5" y="112" width="125" height="44" rx="6" fill="#ffffff" stroke="#9d9d9c" stroke-width="1.5"/>
  <text x="695" y="139" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d1d1b" text-anchor="middle">CheckoutService</text>
  <rect x="775" y="112" width="125" height="44" rx="6" fill="#ffffff" stroke="#9d9d9c" stroke-width="1.5"/>
  <text x="837.5" y="139" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d1d1b" text-anchor="middle">InvoiceWriter</text>

  <line x1="552.5" y1="156" x2="600" y2="206" stroke="#1d1d1b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="695" y1="156" x2="695" y2="206" stroke="#1d1d1b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="837.5" y1="156" x2="790" y2="206" stroke="#1d1d1b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="705" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5f5f5e">fragen nur</text>

  <rect x="490" y="208" width="410" height="78" rx="6" fill="#d1ebf7" stroke="#0090d4" stroke-width="2"/>
  <text x="504" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d1d1b">Order</text>
  <text x="504" y="252" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1d1d1b">bool <tspan font-weight="bold">QualifiesForFreeShipping</tspan> =&gt;</text>
  <text x="524" y="272" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1d1d1b">Total &gt;= ShippingRules.FreeShippingThreshold;</text>

  <line x1="695" y1="286" x2="695" y2="310" stroke="#1d1d1b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="312" width="410" height="56" rx="6" fill="#e5f1d9" stroke="#71af2e" stroke-width="2"/>
  <text x="504" y="333" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d1d1b">ShippingRules</text>
  <text x="886" y="333" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#4a7a1c" text-anchor="end">✓ einzige 50</text>
  <text x="504" y="356" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1d1d1b">const decimal FreeShippingThreshold = <tspan font-weight="bold" fill="#4a7a1c">50m</tspan>;</text>

  <text x="490" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">50 € → 60 €: <tspan font-weight="bold">1 Stelle</tspan> ändern.</text>
</svg>
