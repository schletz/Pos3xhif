<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470">
  <rect x="0.5" y="0.5" width="939" height="469" rx="8" fill="#ffffff" stroke="#9d9d9c"/>
  <text x="470.0" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1d1d1b" text-anchor="middle">DRY und SOLID: sechs Prinzipien für änderbaren Code</text>
  <g>
    <rect x="30" y="70" width="280" height="165" rx="10" fill="#ffffff" stroke="#6cc1b0" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="45" y="85" width="62" height="52" rx="8" fill="#e5f4f1" stroke="#6cc1b0" stroke-width="1.5"/>
    <text x="76" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2f7d6e" text-anchor="middle">DRY</text>
    <text x="120" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d1d1b">Don&#8217;t Repeat Yourself</text>
    <text x="120" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2f7d6e">Grundregel</text>
    <text x="45" y="167" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">Jedes Wissen steht an</text>
    <text x="45" y="189" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">genau einer Stelle im Code.</text>
    <text x="295" y="223" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5f5f5e" text-anchor="end">→ Kapitel 02</text>
  </g>
  <g>
    <rect x="330" y="70" width="280" height="165" rx="10" fill="#ffffff" stroke="#0090d4" stroke-width="2"/>
    <rect x="345" y="85" width="62" height="52" rx="8" fill="#d1ebf7" stroke="#0090d4" stroke-width="1.5"/>
    <text x="376" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#00628f" text-anchor="middle">S</text>
    <text x="420" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d1d1b">Single Responsibility</text>
    <text x="420" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#00628f">SOLID</text>
    <text x="345" y="167" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">Eine Klasse hat nur einen</text>
    <text x="345" y="189" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">Grund, sich zu ändern.</text>
    <text x="595" y="223" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5f5f5e" text-anchor="end">→ Kapitel 03</text>
  </g>
  <g>
    <rect x="630" y="70" width="280" height="165" rx="10" fill="#ffffff" stroke="#0090d4" stroke-width="2"/>
    <rect x="645" y="85" width="62" height="52" rx="8" fill="#d1ebf7" stroke="#0090d4" stroke-width="1.5"/>
    <text x="676" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#00628f" text-anchor="middle">O</text>
    <text x="720" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d1d1b">Open/Closed</text>
    <text x="720" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#00628f">SOLID</text>
    <text x="645" y="167" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">Neues ergänzen, ohne</text>
    <text x="645" y="189" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">bestehenden Code zu ändern.</text>
    <text x="895" y="223" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5f5f5e" text-anchor="end">→ Kapitel 04 und 05</text>
  </g>
  <g>
    <rect x="30" y="255" width="280" height="165" rx="10" fill="#ffffff" stroke="#0090d4" stroke-width="2"/>
    <rect x="45" y="270" width="62" height="52" rx="8" fill="#d1ebf7" stroke="#0090d4" stroke-width="1.5"/>
    <text x="76" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#00628f" text-anchor="middle">L</text>
    <text x="120" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d1d1b">Liskov Substitution</text>
    <text x="120" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#00628f">SOLID</text>
    <text x="45" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">Jede Implementierung hält,</text>
    <text x="45" y="374" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">was ihr Typ verspricht.</text>
    <text x="295" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5f5f5e" text-anchor="end">→ Kapitel 06</text>
  </g>
  <g>
    <rect x="330" y="255" width="280" height="165" rx="10" fill="#ffffff" stroke="#0090d4" stroke-width="2"/>
    <rect x="345" y="270" width="62" height="52" rx="8" fill="#d1ebf7" stroke="#0090d4" stroke-width="1.5"/>
    <text x="376" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#00628f" text-anchor="middle">I</text>
    <text x="420" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d1d1b">Interface Segregation</text>
    <text x="420" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#00628f">SOLID</text>
    <text x="345" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">Kleine, passende Interfaces</text>
    <text x="345" y="374" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">statt eines großen.</text>
    <text x="595" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5f5f5e" text-anchor="end">→ Kapitel 07</text>
  </g>
  <g>
    <rect x="630" y="255" width="280" height="165" rx="10" fill="#ffffff" stroke="#0090d4" stroke-width="2"/>
    <rect x="645" y="270" width="62" height="52" rx="8" fill="#d1ebf7" stroke="#0090d4" stroke-width="1.5"/>
    <text x="676" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#00628f" text-anchor="middle">D</text>
    <text x="720" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d1d1b">Dependency Inversion</text>
    <text x="720" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#00628f">SOLID</text>
    <text x="645" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">Abhängig von Abstraktionen,</text>
    <text x="645" y="374" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1b">nicht von Details.</text>
    <text x="895" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5f5f5e" text-anchor="end">→ Kapitel 08</text>
  </g>
  <text x="470.0" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1d1d1b" text-anchor="middle">Gestrichelt: DRY als allgemeine Grundregel · durchgezogen: die fünf SOLID-Prinzipien</text>
</svg>
