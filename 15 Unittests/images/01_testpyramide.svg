<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <rect x="0.5" y="0.5" width="819" height="399" rx="8" fill="#ffffff" stroke="#9d9d9c"/>

  <!-- Pyramid levels -->
  <polygon points="260,40 320,140 200,140" fill="#fdebd1" stroke="#f39000" stroke-width="1.5"/>
  <polygon points="200,140 320,140 380,240 140,240" fill="#e5f4f1" stroke="#6cc1b0" stroke-width="1.5"/>
  <polygon points="140,240 380,240 440,340 80,340" fill="#d1ebf7" stroke="#0090d4" stroke-width="1.5"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d1d1b" text-anchor="middle">
    <text x="260" y="120">E2E</text>
    <text x="260" y="197">Integration</text>
    <text x="260" y="297">Unit</text>
  </g>

  <!-- Arrow on the left: cost grows upwards -->
  <line x1="40" y1="335" x2="40" y2="55" stroke="#5f5f5e" stroke-width="1.5"/>
  <polygon points="40,45 34,58 46,58" fill="#5f5f5e"/>
  <text x="30" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5f5f5e" text-anchor="middle" transform="rotate(-90 30 200)">langsamer, teurer, wackeliger</text>

  <!-- Dashed helper lines to the descriptions -->
  <g stroke="#9d9d9c" stroke-width="1" stroke-dasharray="4 4">
    <line x1="300" y1="95" x2="460" y2="95"/>
    <line x1="350" y1="190" x2="460" y2="190"/>
    <line x1="410" y1="290" x2="460" y2="290"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1d1d1b">
    <text x="470" y="80" font-weight="bold" font-size="15">End-to-End Test</text>
    <text x="470" y="100">Die ganze App, bedient wie von einem User</text>
    <text x="470" y="118" fill="#5f5f5e">z. B. im Browser · Sekunden · wenige Tests</text>

    <text x="470" y="175" font-weight="bold" font-size="15">Integration Test</text>
    <text x="470" y="195">Mehrere Teile zusammen, z. B. mit Datenbank</text>
    <text x="470" y="213" fill="#5f5f5e">z. B. EF Core + SQLite · Sekunden · einige</text>

    <text x="470" y="275" font-weight="bold" font-size="15">Unit Test</text>
    <text x="470" y="295">Eine Methode oder Klasse, isoliert</text>
    <text x="470" y="313" fill="#5f5f5e">keine Datenbank · Millisekunden · sehr viele</text>
  </g>

  <text x="410" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1b" text-anchor="middle">Die meisten Tests sind Unit Tests. Je höher die Ebene, desto weniger Tests.</text>
</svg>
