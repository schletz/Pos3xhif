<text x="530.0" y="125.0" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="start" fill="#1d1d1b" xml:space="preserve">SELECT e.*</text>
<text x="530.0" y="151.0" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="start" fill="#1d1d1b" xml:space="preserve">FROM Events AS e</text>
<text x="530.0" y="177.0" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="start" fill="#1d1d1b" xml:space="preserve">WHERE EXISTS (</text>
<text x="530.0" y="203.0" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="start" fill="#1d1d1b" xml:space="preserve">    SELECT 1 FROM Shows AS s</text>
<text x="530.0" y="229.0" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="start" fill="#1d1d1b" xml:space="preserve">    WHERE s.EventId = e.Id</text>
<text x="530.0" y="255.0" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="start" fill="#1d1d1b" xml:space="preserve">      AND strftime(&#x27;%Y&#x27;, s.Date) = &#x27;2024&#x27;)</text>
<text x="510.0" y="335.0" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" font-weight="normal" text-anchor="start" fill="#1d1d1b" xml:space="preserve">e.Shows.Any(…)        →  EXISTS (…)</text>
<text x="510.0" y="362.0" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" font-weight="normal" text-anchor="start" fill="#1d1d1b" xml:space="preserve">!e.Shows.Any(…)       →  NOT EXISTS (…)</text>
<text x="510.0" y="389.0" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" font-weight="normal" text-anchor="start" fill="#1d1d1b" xml:space="preserve">e.Shows.All(s =&gt; …)   →  NOT EXISTS (… NOT …)</text>
