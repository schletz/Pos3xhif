<text x="45.0" y="372.0" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="start" fill="#1d1d1b" xml:space="preserve">  e.Shows.Any(s =&gt; s.Date.Year == 2024))</text>
<text x="45.0" y="394.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#a35f00" xml:space="preserve">„Gibt es mindestens eine Show im Jahr 2024?“</text>
