<text x="108.0" y="117.0" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="20" font-weight="normal" text-anchor="start" fill="#1d1d1b" xml:space="preserve" textLength="77.0" lengthAdjust="spacingAndGlyphs">IsAdult</text>
