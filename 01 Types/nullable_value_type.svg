<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<rect x="1" y="1" width="898" height="328" rx="12" fill="#ffffff" stroke="#9d9d9c" stroke-width="1.5"/>
<text x="450" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1d1d1b">int und int? im Speicher</text>
<line x1="305" y1="70" x2="305" y2="305" stroke="#9d9d9c" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="595" y1="70" x2="595" y2="305" stroke="#9d9d9c" stroke-width="1.5" stroke-dasharray="6 4"/>

<!-- int -->
<text x="160" y="92" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="17" fill="#1d1d1b">int a = 42;</text>
<rect x="95" y="120" width="130" height="56" rx="6" fill="#d1ebf7" stroke="#0090d4" stroke-width="2"/>
<text x="160" y="156" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="22" font-weight="700" fill="#1d1d1b">42</text>
<text x="160" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5f5f5e">nur der Wert (4 Byte)</text>
<text x="160" y="262" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="14" fill="#1d1d1b">a → 42</text>
<text x="160" y="286" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1d1d1b">kann nie null sein</text>

<!-- int? with value -->
<text x="450" y="92" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="17" fill="#1d1d1b">int? b = 42;</text>
<rect x="355" y="120" width="190" height="112" rx="6" fill="#d1ebf7" stroke="#0090d4" stroke-width="2"/>
<line x1="355" y1="176" x2="545" y2="176" stroke="#0090d4" stroke-width="1.5"/>
<line x1="455" y1="120" x2="455" y2="232" stroke="#0090d4" stroke-width="1.5"/>
<text x="367" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1d1d1b">HasValue</text>
<text x="500" y="155" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#1d1d1b">true</text>
<text x="367" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1d1d1b">Value</text>
<text x="500" y="211" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#1d1d1b">42</text>
<text x="450" y="262" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="14" fill="#4a7a1c">✓ b.HasValue → true</text>
<text x="450" y="286" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="14" fill="#4a7a1c">✓ b.Value → 42</text>

<!-- int? without value -->
<text x="745" y="92" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="17" fill="#1d1d1b">int? c = null;</text>
<rect x="650" y="120" width="190" height="112" rx="6" fill="#ededed" stroke="#5f5f5e" stroke-width="2"/>
<rect x="751" y="177" width="88" height="54" fill="#f6d3db"/>
<line x1="650" y1="176" x2="840" y2="176" stroke="#5f5f5e" stroke-width="1.5"/>
<line x1="750" y1="120" x2="750" y2="232" stroke="#5f5f5e" stroke-width="1.5"/>
<text x="662" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1d1d1b">HasValue</text>
<text x="795" y="155" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#1d1d1b">false</text>
<text x="662" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1d1d1b">Value</text>
<text x="795" y="211" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#a8072c">✗ kein Wert</text>
<text x="745" y="262" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="14" fill="#4a7a1c">✓ c.HasValue → false</text>
<text x="745" y="286" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="14" fill="#a8072c">✗ c.Value → Exception</text>
<text x="745" y="306" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8072c">(InvalidOperationException)</text>
</svg>
