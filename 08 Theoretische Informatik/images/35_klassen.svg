<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390">
  <rect x="0.5" y="0.5" width="759" height="389" rx="6" fill="#ffffff" stroke="#d1d5db"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="260" y="30">Vermutung: P ≠ NP</text>
    <text x="640" y="30">Falls P = NP</text>
  </g>
  <line x1="520" y1="16" x2="520" y2="320" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Left: NP with P and NP-complete inside -->
  <ellipse cx="260" cy="175" rx="230" ry="130" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <ellipse cx="160" cy="185" rx="100" ry="78" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="390" cy="185" rx="85" ry="75" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="260" y="72" font-size="18" font-weight="bold" fill="#1f2937">NP</text>
    <text x="260" y="90" font-size="12" fill="#6b7280">Lösung schnell prüfbar</text>

    <text x="160" y="145" font-size="18" font-weight="bold" fill="#2563eb">P</text>
    <text x="160" y="163" font-size="12" fill="#2563eb">schnell lösbar</text>

    <text x="390" y="148" font-size="14" font-weight="bold" fill="#ea580c">NP-vollständig</text>
    <text x="390" y="165" font-size="12" fill="#ea580c">die schwersten in NP</text>

    <text x="283" y="282" font-size="12" fill="#6b7280">Faktorisieren ?</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="160" y="190">Sortieren</text>
    <text x="160" y="208">Kürzeste Wege</text>
    <text x="160" y="226">Binäre Suche</text>
    <text x="390" y="190">SAT</text>
    <text x="390" y="207">TSP</text>
    <text x="390" y="224">Rucksack</text>
    <text x="390" y="241">Sudoku n²×n²</text>
  </g>

  <!-- Right: everything collapses -->
  <ellipse cx="640" cy="175" rx="100" ry="80" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="160" font-size="18" font-weight="bold" fill="#2563eb">P = NP</text>
    <text x="640" y="184" font-size="12" fill="#1f2937">auch alle NP-vollständigen</text>
    <text x="640" y="200" font-size="12" fill="#1f2937">Probleme wären</text>
    <text x="640" y="216" font-size="12" fill="#1f2937">schnell lösbar</text>
  </g>

  <!-- Notes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">
    <text x="20" y="342">Die linke Skizze nimmt P ≠ NP an. Ob das stimmt, ist bis heute nicht bewiesen.</text>
    <text x="20" y="360">Alle Probleme als Ja/Nein-Frage. Für Faktorisieren ist weder ein schneller Algorithmus bekannt</text>
    <text x="20" y="378">noch ein Nachweis, dass es NP-vollständig ist.</text>
  </g>
</svg>
