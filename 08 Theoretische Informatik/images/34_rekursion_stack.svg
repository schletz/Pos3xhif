<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390">
  <rect x="0.5" y="0.5" width="759" height="389" rx="6" fill="#ffffff" stroke="#d1d5db"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="250" y="30">Aufrufbaum von Fib(4)</text>
    <text x="630" y="30">Aufrufstack</text>
  </g>
  <line x1="505" y1="16" x2="505" y2="320" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Tree edges -->
  <g stroke="#1f2937" stroke-width="1.5">
    <line x1="270" y1="74" x2="155" y2="116"/>
    <line x1="270" y1="74" x2="390" y2="116"/>
    <line x1="155" y1="144" x2="97" y2="186"/>
    <line x1="155" y1="144" x2="210" y2="186"/>
    <line x1="390" y1="144" x2="345" y2="186"/>
    <line x1="390" y1="144" x2="440" y2="186"/>
    <line x1="97" y1="214" x2="60" y2="256"/>
    <line x1="97" y1="214" x2="135" y2="256"/>
  </g>

  <!-- On the stack -->
  <g fill="#ffedd5" stroke="#ea580c" stroke-width="1.5">
    <rect x="237" y="46" width="66" height="28" rx="5"/>
    <rect x="122" y="116" width="66" height="28" rx="5"/>
    <rect x="64" y="186" width="66" height="28" rx="5"/>
    <rect x="102" y="256" width="66" height="28" rx="5" stroke-width="3"/>
  </g>
  <!-- Finished -->
  <g fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5">
    <rect x="27" y="256" width="66" height="28" rx="5"/>
  </g>
  <!-- Not yet called -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3">
    <rect x="357" y="116" width="66" height="28" rx="5"/>
    <rect x="177" y="186" width="66" height="28" rx="5"/>
    <rect x="312" y="186" width="66" height="28" rx="5"/>
    <rect x="407" y="186" width="66" height="28" rx="5"/>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="270" y="65">Fib(4)</text>
    <text x="155" y="135">Fib(3)</text>
    <text x="390" y="135">Fib(2)</text>
    <text x="97" y="205">Fib(2)</text>
    <text x="210" y="205">Fib(1)</text>
    <text x="345" y="205">Fib(1)</text>
    <text x="440" y="205">Fib(0)</text>
    <text x="60" y="275">Fib(1)</text>
    <text x="135" y="275">Fib(0)</text>
  </g>

  <!-- Stack frames, bottom frame is the first call -->
  <text x="630" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">oberster Rahmen läuft gerade</text>
  <g fill="#ffedd5" stroke="#ea580c" stroke-width="1.5">
    <rect x="555" y="150" width="150" height="34" stroke-width="3"/>
    <rect x="555" y="184" width="150" height="34"/>
    <rect x="555" y="218" width="150" height="34"/>
    <rect x="555" y="252" width="150" height="34"/>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2937">
    <text x="568" y="172">Fib(0)</text>
    <text x="568" y="206">Fib(2)</text>
    <text x="568" y="240">Fib(3)</text>
    <text x="568" y="274">Fib(4)</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#6b7280" text-anchor="end">
    <text x="694" y="172">n = 0</text>
    <text x="694" y="206">n = 2</text>
    <text x="694" y="240">n = 3</text>
    <text x="694" y="274">n = 4</text>
  </g>
  <text x="630" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">Tiefe 4 = n</text>

  <!-- Legend -->
  <g stroke-width="1.5">
    <rect x="30" y="334" width="16" height="14" rx="3" fill="#ffedd5" stroke="#ea580c"/>
    <rect x="200" y="334" width="16" height="14" rx="3" fill="#e5e7eb" stroke="#6b7280"/>
    <rect x="430" y="334" width="16" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-dasharray="4 3"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">
    <text x="54" y="346">auf dem Stack</text>
    <text x="224" y="346">fertig, Rahmen wieder frei</text>
    <text x="454" y="346">noch nicht aufgerufen</text>
  </g>
  <text x="380" y="375" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Fib(4) macht 9 Aufrufe, aber höchstens 4 Rahmen liegen gleichzeitig auf dem Stack.</text>
</svg>
