<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
<rect x="0.5" y="0.5" width="639" height="359" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="30" y="32" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Eindeutiger Baum für id + id * id</text>
