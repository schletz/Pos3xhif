    <text x="430" y="92" font-weight="600">Zelle d[2, 1] (TR nach B, gestrichelt):</text>
    <text x="430" y="112">R ≠ B, also 1 + Minimum aus</text>
    <text x="430" y="132" fill="#ea580c">↖ ersetzen:  d[1, 0] = 1</text>
    <text x="430" y="152" fill="#ea580c">↑ löschen:  d[1, 1] = 1</text>
    <text x="430" y="172" fill="#ea580c">← einfügen:  d[2, 0] = 2</text>
    <text x="430" y="192">d[2, 1] = 1 + 1 = 2</text>
    <text x="430" y="232" font-weight="600">Rückweg (grün) ab d[5, 4] = 2:</text>
    <text x="430" y="252">• T löschen</text>
    <text x="430" y="272">• R durch B ersetzen</text>
    <text x="430" y="292">• A behalten</text>
