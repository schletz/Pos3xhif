<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340">
  <rect x="0.5" y="0.5" width="639" height="339" rx="6" fill="#ffffff" stroke="#d1d5db"/>

  <!-- Edges -->
  <g stroke="#1f2937" stroke-width="1.5">
    <line x1="290" y1="76" x2="150" y2="130"/>
    <line x1="330" y1="76" x2="470" y2="130"/>
    <line x1="450" y1="176" x2="370" y2="230"/>
    <line x1="490" y1="176" x2="550" y2="230"/>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#6b7280">
    <text x="190" y="98" text-anchor="end">Left</text>
    <text x="430" y="98">Right</text>
    <text x="398" y="204" text-anchor="end">Left</text>
    <text x="530" y="204">Right</text>
  </g>

  <!-- Inner nodes -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.5">
    <rect x="235" y="26" width="150" height="50" rx="6"/>
    <rect x="395" y="130" width="150" height="50" rx="6"/>
  </g>
  <!-- Leaves -->
  <g fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5">
    <rect x="75" y="130" width="150" height="50" rx="6"/>
    <rect x="295" y="230" width="150" height="50" rx="6"/>
    <rect x="475" y="230" width="150" height="50" rx="6"/>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="310" y="47">BinaryExpr</text>
    <text x="470" y="151">BinaryExpr</text>
    <text x="150" y="151">NumberExpr</text>
    <text x="370" y="251">NumberExpr</text>
    <text x="550" y="251">NumberExpr</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#2563eb" text-anchor="middle">
    <text x="310" y="66">Multiply  *</text>
    <text x="470" y="170">Add  +</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#6b7280" text-anchor="middle">
    <text x="150" y="170">Value = 2</text>
    <text x="370" y="270">Value = 3</text>
    <text x="550" y="270">Value = 4</text>
  </g>

  <!-- Values computed by the evaluator -->
  <g font-family="Consolas, Menlo, monospace" font-size="14" font-weight="bold" fill="#16a34a">
    <text x="395" y="56">= 14</text>
    <text x="555" y="160">= 7</text>
  </g>

  <text x="320" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Die Klammern stehen nicht im Baum: (3 + 4) ist der rechte Teilbaum der Multiplikation.</text>
</svg>
