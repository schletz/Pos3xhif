<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
<rect x="0.5" y="0.5" width="759" height="399" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="30" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Chomsky-Hierarchie der Sprachen: Typ 3 ⊂ Typ 2 ⊂ Typ 1 ⊂ Typ 0</text>

<rect x="20" y="50" width="720" height="330" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="38" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Typ 0 · unbeschränkt</text>
<text x="722" y="76" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">Turingmaschine · Programme, die anhalten</text>

<rect x="45" y="90" width="670" height="270" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="63" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Typ 1 · kontextsensitiv</text>
<text x="697" y="116" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">linear beschränkter Automat · aⁿbⁿcⁿ</text>

<rect x="70" y="130" width="620" height="210" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="88" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Typ 2 · kontextfrei</text>
<text x="672" y="156" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">Kellerautomat · aⁿbⁿ, Klammern, Ausdrücke</text>

<rect x="95" y="170" width="570" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="113" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Typ 3 · regulär</text>
<text x="647" y="196" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">endlicher Automat, regulärer Ausdruck</text>
<text x="113" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">Produktionen:</text>
<text x="215" y="232" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2937">A → aB | a | ε</text>
<text x="113" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">Beispiele:</text>
<text x="215" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">Binärzahlen, Bezeichner, Zahlen-Literale</text>
<text x="113" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Die Tokens einer Programmiersprache liegen hier, ihr Aufbau (Ausdrücke, Blöcke) in Typ 2.</text>
</svg>
