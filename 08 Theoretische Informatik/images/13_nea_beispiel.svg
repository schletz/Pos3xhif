    <path d="M401,270 C385,228 435,228 419,270"/>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="16" fill="#1f2937" text-anchor="middle">
    <text x="110" y="60">a, b</text>
    <text x="185" y="112">a</text>
    <text x="335" y="112">b</text>
    <text x="185" y="282">+, −, ε</text>
    <text x="335" y="282">0–9</text>
    <text x="410" y="230">0–9</text>
  </g>
  <g stroke="#2563eb" stroke-width="2" fill="#dbeafe">
