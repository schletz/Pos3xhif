  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937">
    <text x="20" y="28" font-weight="600">NEA: Wörter, die auf ab enden</text>
    <text x="20" y="200" font-weight="600">ε-NEA: Ganzzahl mit optionalem Vorzeichen</text>
  </g>
  <line x1="20" y1="172" x2="500" y2="172" stroke="#d1d5db"/>
