<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330">
  <rect x="0.5" y="0.5" width="779" height="329" rx="6" fill="#ffffff" stroke="#d1d5db"/>

  <!-- Level labels -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">
    <text x="18" y="58">Ebene 0</text>
    <text x="18" y="118">Ebene 1</text>
    <text x="18" y="178">Ebene 2</text>
    <text x="18" y="238">Ebene 3</text>
  </g>

  <!-- Edges: parent bottom center to child top center -->
  <g stroke="#1f2937" stroke-width="1.4">
    <line x1="320" y1="66" x2="200" y2="100"/>
    <line x1="320" y1="66" x2="440" y2="100"/>
    <line x1="200" y1="126" x2="140" y2="160"/>
    <line x1="200" y1="126" x2="260" y2="160"/>
    <line x1="440" y1="126" x2="380" y2="160"/>
    <line x1="440" y1="126" x2="500" y2="160"/>
    <line x1="140" y1="186" x2="110" y2="220"/>
    <line x1="140" y1="186" x2="170" y2="220"/>
    <line x1="260" y1="186" x2="230" y2="220"/>
    <line x1="260" y1="186" x2="290" y2="220"/>
    <line x1="380" y1="186" x2="350" y2="220"/>
    <line x1="380" y1="186" x2="410" y2="220"/>
    <line x1="500" y1="186" x2="470" y2="220"/>
    <line x1="500" y1="186" x2="530" y2="220"/>
  </g>

  <!-- Level 0: 8 cells -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.4">
    <rect x="232" y="40" width="176" height="26" rx="4"/>
    <rect x="156" y="100" width="88" height="26" rx="4"/>
    <rect x="396" y="100" width="88" height="26" rx="4"/>
    <rect x="118" y="160" width="44" height="26" rx="4"/>
    <rect x="238" y="160" width="44" height="26" rx="4"/>
    <rect x="358" y="160" width="44" height="26" rx="4"/>
    <rect x="478" y="160" width="44" height="26" rx="4"/>
  </g>
  <g fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4">
    <rect x="99" y="220" width="22" height="26" rx="4"/>
    <rect x="159" y="220" width="22" height="26" rx="4"/>
    <rect x="219" y="220" width="22" height="26" rx="4"/>
    <rect x="279" y="220" width="22" height="26" rx="4"/>
    <rect x="339" y="220" width="22" height="26" rx="4"/>
    <rect x="399" y="220" width="22" height="26" rx="4"/>
    <rect x="459" y="220" width="22" height="26" rx="4"/>
    <rect x="519" y="220" width="22" height="26" rx="4"/>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="243" y="58">5</text><text x="265" y="58">2</text><text x="287" y="58">8</text><text x="309" y="58">1</text>
    <text x="331" y="58">9</text><text x="353" y="58">3</text><text x="375" y="58">7</text><text x="397" y="58">4</text>
    <text x="167" y="118">5</text><text x="189" y="118">2</text><text x="211" y="118">8</text><text x="233" y="118">1</text>
    <text x="407" y="118">9</text><text x="429" y="118">3</text><text x="451" y="118">7</text><text x="473" y="118">4</text>
    <text x="129" y="178">5</text><text x="151" y="178">2</text>
    <text x="249" y="178">8</text><text x="271" y="178">1</text>
    <text x="369" y="178">9</text><text x="391" y="178">3</text>
    <text x="489" y="178">7</text><text x="511" y="178">4</text>
    <text x="110" y="238">5</text><text x="170" y="238">2</text><text x="230" y="238">8</text><text x="290" y="238">1</text>
    <text x="350" y="238">9</text><text x="410" y="238">3</text><text x="470" y="238">7</text><text x="530" y="238">4</text>
  </g>

  <!-- Work per level -->
  <line x1="590" y1="30" x2="590" y2="250" stroke="#d1d5db"/>
  <text x="680" y="26" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">Merge-Arbeit</text>
  <g font-family="Consolas, Menlo, monospace" font-size="14" text-anchor="middle">
    <text x="680" y="58" fill="#ea580c">1 · 8 = 8</text>
    <text x="680" y="118" fill="#ea580c">2 · 4 = 8</text>
    <text x="680" y="178" fill="#ea580c">4 · 2 = 8</text>
    <text x="680" y="238" fill="#6b7280">Basisfall</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="390" y="284">log₂ 8 = 3 Ebenen mit je n = 8 Schritten Merge-Arbeit: 3 · 8 = 24 Schritte</text>
    <text x="390" y="306">Allgemein: log₂ n Ebenen · n Schritte = n · log₂ n, also O(n log n)</text>
  </g>
</svg>
