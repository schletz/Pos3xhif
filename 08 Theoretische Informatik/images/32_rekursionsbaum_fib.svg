<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352">
  <rect x="0.5" y="0.5" width="759" height="351" rx="6" fill="#ffffff" stroke="#d1d5db"/>

  <!-- Second computation of F(3) -->
  <rect x="374" y="83" width="212" height="154" rx="8" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="480" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ea580c" text-anchor="middle">F(3) wird ein zweites Mal berechnet</text>

  <!-- Edges -->
  <g stroke="#1f2937" stroke-width="1.4">
    <line x1="362" y1="60" x2="226" y2="88"/>
    <line x1="362" y1="60" x2="498" y2="88"/>
    <line x1="226" y1="116" x2="148" y2="144"/>
    <line x1="226" y1="116" x2="305" y2="144"/>
    <line x1="498" y1="116" x2="445" y2="144"/>
    <line x1="498" y1="116" x2="550" y2="144"/>
    <line x1="148" y1="172" x2="95" y2="200"/>
    <line x1="148" y1="172" x2="200" y2="200"/>
    <line x1="305" y1="172" x2="270" y2="200"/>
    <line x1="305" y1="172" x2="340" y2="200"/>
    <line x1="445" y1="172" x2="410" y2="200"/>
    <line x1="445" y1="172" x2="480" y2="200"/>
    <line x1="95" y1="228" x2="60" y2="256"/>
    <line x1="95" y1="228" x2="130" y2="256"/>
  </g>

  <!-- Inner nodes -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.5">
    <rect x="334" y="32" width="56" height="28" rx="6"/>
    <rect x="198" y="88" width="56" height="28" rx="6"/>
    <rect x="470" y="88" width="56" height="28" rx="6"/>
    <rect x="120" y="144" width="56" height="28" rx="6"/>
  </g>
  <!-- F(2): computed three times -->
  <g fill="#ffedd5" stroke="#ea580c" stroke-width="1.5">
    <rect x="277" y="144" width="56" height="28" rx="6"/>
    <rect x="417" y="144" width="56" height="28" rx="6"/>
    <rect x="67" y="200" width="56" height="28" rx="6"/>
  </g>
  <!-- Base cases -->
  <g fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5">
    <rect x="522" y="144" width="56" height="28" rx="6"/>
    <rect x="172" y="200" width="56" height="28" rx="6"/>
    <rect x="242" y="200" width="56" height="28" rx="6"/>
    <rect x="312" y="200" width="56" height="28" rx="6"/>
    <rect x="382" y="200" width="56" height="28" rx="6"/>
    <rect x="452" y="200" width="56" height="28" rx="6"/>
    <rect x="32" y="256" width="56" height="28" rx="6"/>
    <rect x="102" y="256" width="56" height="28" rx="6"/>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="362" y="51">F(5)</text>
    <text x="226" y="107">F(4)</text>
    <text x="498" y="107">F(3)</text>
    <text x="148" y="163">F(3)</text>
    <text x="305" y="163">F(2)</text>
    <text x="445" y="163">F(2)</text>
    <text x="550" y="163">F(1)</text>
    <text x="95" y="219">F(2)</text>
    <text x="200" y="219">F(1)</text>
    <text x="270" y="219">F(1)</text>
    <text x="340" y="219">F(0)</text>
    <text x="410" y="219">F(1)</text>
    <text x="480" y="219">F(0)</text>
    <text x="60" y="275">F(1)</text>
    <text x="130" y="275">F(0)</text>
  </g>

  <!-- Calls per level -->
  <line x1="610" y1="30" x2="610" y2="286" stroke="#d1d5db"/>
  <text x="685" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">Aufrufe</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="685" y="51">1 von max. 1</text>
    <text x="685" y="107">2 von max. 2</text>
    <text x="685" y="163">4 von max. 4</text>
    <text x="685" y="219">6 von max. 8</text>
    <text x="685" y="275">2 von max. 16</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="380" y="314">15 Aufrufe für F(5). Grau: Basisfall. Orange: F(2) wird dreimal berechnet.</text>
    <text x="380" y="336">Jede Ebene hat höchstens doppelt so viele Aufrufe wie die vorige: weniger als 2ⁿ Aufrufe.</text>
  </g>
</svg>
