  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">
    <text x="28" y="94" font-weight="600">i   Gegenstand</text>
    <text x="28" y="132">0   (keiner)</text>
    <text x="28" y="170">1   A: 1 kg, Wert 1</text>
    <text x="28" y="208">2   B: 3 kg, Wert 4</text>
    <text x="28" y="246">3   C: 4 kg, Wert 5</text>
    <text x="28" y="284">4   D: 5 kg, Wert 7</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">
    <text x="608" y="92" font-weight="600">Rückweg ab best[4, 7]:</text>
    <text x="608" y="118">best[4, 7] = 9 = best[3, 7]</text>
    <text x="608" y="138" fill="#ea580c">↑ D nicht genommen</text>
    <text x="608" y="164">best[3, 7] = 9 ≠ best[2, 7] = 5</text>
    <text x="608" y="184" fill="#ea580c">↖ C genommen, c = 7 − 4 = 3</text>
    <text x="608" y="210">best[2, 3] = 4 ≠ best[1, 3] = 1</text>
    <text x="608" y="230" fill="#ea580c">↖ B genommen, c = 3 − 3 = 0</text>
    <text x="608" y="256">best[1, 0] = 0 = best[0, 0]</text>
    <text x="608" y="276" fill="#ea580c">↑ A nicht genommen</text>
  </g>
  <text x="20" y="338" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#16a34a">Auswahl: B und C (grün), Gewicht 3 + 4 = 7 kg, Wert 4 + 5 = 9</text>
