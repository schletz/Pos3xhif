  <text x="46" y="361" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Einzelne Faktoren schwanken (Cache, Takt, andere Programme). Entscheidend ist der Trend über mehrere Verdopplungen.</text>
