  <text x="46" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Regel: Wächst die Laufzeit wie nᵏ, dann gilt T(2n) / T(n) ≈ 2ᵏ.</text>
