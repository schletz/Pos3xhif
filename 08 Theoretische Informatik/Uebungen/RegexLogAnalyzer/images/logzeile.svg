<svg xmlns="http://www.w3.org/2000/svg" width="780" height="350" viewBox="0 0 780 350">
  <rect x="0.5" y="0.5" width="779" height="349" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Eine Zeile im Combined Log Format (in der Datei steht alles in einer Zeile)</text>

  <!-- Row 1: client and timestamp -->
  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#1f2937">
    <rect x="20" y="48" width="117" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="28" y="68">203.0.113.5</text>
    <rect x="167" y="48" width="26" height="30" rx="4" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="175" y="68">-</text>
    <rect x="233" y="48" width="53" height="30" rx="4" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="241" y="68">anna</text>
    <rect x="316" y="48" width="274" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="324" y="68">[17/Oct/2026:08:15:02 +0200]</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="78" y="96">IP-Adresse</text>
    <text x="180" y="96">Identität</text>
    <text x="259" y="96">Benutzer</text>
    <text x="453" y="96">Zeitstempel</text>
  </g>

  <!-- Row 2: request in double quotes -->
  <rect x="12" y="128" width="372" height="50" rx="6" fill="none" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#1f2937">
    <text x="22" y="158">"</text>
    <rect x="36" y="138" width="44" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="44" y="158">GET</text>
    <rect x="90" y="138" width="80" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="98" y="158">/search</text>
    <rect x="174" y="138" width="90" height="30" rx="4" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="182" y="158">?q=regex</text>
    <rect x="274" y="138" width="90" height="30" rx="4" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="282" y="158">HTTP/1.1</text>
    <text x="370" y="158">"</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="58" y="196">Methode</text>
    <text x="130" y="196">Pfad</text>
    <text x="219" y="196">Query</text>
    <text x="319" y="196">Protokoll</text>
  </g>
  <text x="400" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Request in Anführungszeichen:</text>
  <text x="400" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Methode, Pfad mit optionaler Query, Protokoll</text>

  <!-- Row 3: response and client information -->
  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#1f2937">
    <rect x="20" y="228" width="44" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="28" y="248">200</text>
    <rect x="94" y="228" width="53" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="102" y="248">2326</text>
    <rect x="177" y="228" width="246" height="30" rx="4" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="185" y="248">"https://www.example.at/"</text>
    <rect x="453" y="228" width="292" height="30" rx="4" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="461" y="248">"Mozilla/5.0 (Windows NT 10.0)"</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="42" y="276">Status</text>
    <text x="120" y="276">Bytes</text>
    <text x="300" y="276">Referer</text>
    <text x="599" y="276">User-Agent</text>
  </g>

  <!-- Legend -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">
    <rect x="20" y="308" width="18" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/>
    <text x="46" y="319">landet in LogEntry</text>
    <rect x="190" y="308" width="18" height="14" rx="3" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="216" y="319">wird nur geprüft</text>
    <text x="360" y="319" fill="#6b7280">Zwischen den Feldern steht genau ein Leerzeichen.</text>
  </g>
</svg>
